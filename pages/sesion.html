<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style.css" />
    <title>Inicio de sesión</title>
</head>

<body class="sesion-body">

    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">

        <div class="row justify-content-center w-100">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                <header class="text-center mb-4">
                    <h1 class="display-5 fw-bold text-white">
                        Bienvenido a <span class="text-primary">Plevent</span>
                    </h1>
                    <p class="text-white-50 fs-5">
                        Nos alegra tenerte de vuelta.
                    </p>
                </header>

                <section class="login-card card border-0 shadow-lg">

                    <div class="card-body p-4 p-md-5">

                        <header class="text-center mb-4">
                            <h2 class="fw-bold">Iniciar sesión</h2>
                            <p class="text-secondary">
                                Ingresa tus credenciales para continuar.
                            </p>
                        </header>

                        <form id="login-form">

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">
                                    Correo electrónico
                                </label>

                                <input type="email" class="form-control form-control-lg" id="email" name="email"
                                    placeholder="correo@ejemplo.com" autocomplete="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">
                                    Contraseña
                                </label>

                                <input type="password" class="form-control form-control-lg" id="password"
                                    name="password" placeholder="••••••••" autocomplete="current-password" required>

                                <p id="error" class="text-danger small mt-2 mb-0" role="alert"></p>
                            </div>

                            <div class="d-grid mt-4">
                                <button onclick="iniciarSesion()" type="button"
                                    class="btn btn-primary btn-lg rounded-3">
                                    Ingresar
                                    <i class="bi bi-box-arrow-in-right ms-2"></i>
                                </button>
                            </div>

                        </form>

                    </div>

                    <footer class="card-footer bg-light text-center py-3 border-0">
                        <a href="../index.html" class="text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>
                            Volver al inicio
                        </a>
                    </footer>

                </section>

            </div>

        </div>

    </main>

    <script src="../js/sesion.js"></script>

</body>

</html>
