<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactanos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li id="events"><a href="eventos.html">Eventos</a></li>
                <li><a class="active" href="contact.html">Contactanos</a></li>
                <li id="login"><a href="sesion.html">Iniciar sesión</a></li>
            </ul>
            <button id="logout" class="btn btn-danger" onclick="salir()">Cerrar Sesion</button>
        </nav>
    </header>


    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="text-center mb-4">
                    <h1 class="display-5 fw-bold">¡Contacta con nosotros!</h1>
                    <p class="text-secondary mb-1">
                        ¿Tienes alguna duda sobre un evento o te gustaría agendar tu propio evento?
                    </p>
                    <p class="text-secondary">
                        No dudes en <strong>contactarnos</strong>.
                    </p>
                </div>

                <section class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">

                        <form action="">
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">
                                    Nombre:
                                </label>
                                <input type="text" class="form-control" id="nombre" name="nombre"
                                    placeholder="Ingresa tu nombre" required />
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">
                                    Correo electrónico:
                                </label>
                                <input type="email" class="form-control" id="email" name="email"
                                    placeholder="ejemplo@correo.com" required />
                            </div>

                            <div class="mb-3">
                                <label for="mensaje" class="form-label fw-semibold">
                                    Mensaje:
                                </label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="4"
                                    placeholder="Escribe tu mensaje..." required></textarea>
                            </div>

                            <p id="error" class="text-danger small"></p>

                            <div class="d-grid">
                                <button type="button" class="btn btn-primary btn-lg" onclick="mandarMensaje()">
                                    Enviar mensaje
                                </button>
                            </div>
                        </form>

                    </div>
                </section>

            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p class="mb-0">
            &copy; 2026 Voyager Group. Todos los derechos reservados.
        </p>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/contacto.js"></script>
    <script src="../js/index.js"></script>
</body>

</html>
