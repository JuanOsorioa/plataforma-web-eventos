<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactanos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style.css">
</head>

<body class="page-with-footer">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container">

                <a class="navbar-brand fw-bold fs-4" href="../index.html">
                    <i class="bi bi-calendar-event text-primary me-2"></i>
                    Ple<span class="text-primary">vent</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarEventos"
                    aria-controls="navbarEventos" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarEventos">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">
                                <i class="bi bi-house-door me-1"></i>
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item" id="events">
                            <a class="nav-link" href="eventos.html">
                                <i class="bi bi-ticket-perforated me-1"></i>
                                Eventos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="contact.html">
                                <i class="bi bi-envelope me-1"></i>
                                Contáctanos
                            </a>
                        </li>

                        <li class="nav-item" id="login">
                            <a class="btn btn-outline-light rounded-pill px-4 ms-lg-2" href="pages/sesion.html">
                                Iniciar sesión
                            </a>
                        </li>

                        <li class="nav-item" id="logout">
                            <button class="btn btn-danger rounded-pill px-4 ms-lg-2" onclick="salir()">
                                <i class="bi bi-box-arrow-right me-1"></i>
                                Cerrar sesión
                            </button>
                        </li>

                    </ul>
                </div>
            </div>
        </nav>
    </header>


    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="text-center mb-4">
                    <h1 class="display-5 fw-bold">¡Contacta con nosotros!</h1>
                    <p class="text-secondary mb-1">
                        ¿Tienes alguna duda sobre un evento o te gustaría agendar tu propio evento?
                    </p>
                    <p class="text-secondary">
                        No dudes en <strong>contactarnos</strong>.
                    </p>
                </div>

                <section class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">

                        <form action="">
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">
                                    Nombre:
                                </label>
                                <input type="text" class="form-control" id="nombre" name="nombre"
                                    placeholder="Ingresa tu nombre" required />
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">
                                    Correo electrónico:
                                </label>
                                <input type="email" class="form-control" id="email" name="email"
                                    placeholder="ejemplo@correo.com" required />
                            </div>

                            <div class="mb-3">
                                <label for="mensaje" class="form-label fw-semibold">
                                    Mensaje:
                                </label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="4"
                                    placeholder="Escribe tu mensaje..." required></textarea>
                            </div>

                            <p id="error" class="text-danger small"></p>

                            <div class="d-grid">
                                <button type="button" class="btn btn-primary btn-lg" onclick="mandarMensaje()">
                                    Enviar mensaje
                                </button>
                            </div>
                        </form>

                    </div>
                </section>

            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p class="mb-0">
            &copy; 2026 Voyager Group. Todos los derechos reservados.
        </p>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/contacto.js"></script>
    <script src="../js/index.js"></script>
</body>

</html>
