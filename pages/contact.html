<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactanos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li id="events"><a href="eventos.html">Eventos</a></li>
                <li><a class="active" href="contact.html">Contactanos</a></li>
                <li id="login"><a href="sesion.html">Iniciar sesión</a></li>
            </ul>
            <button id="logout" class="btn btn-danger" onclick="salir()">Cerrar Sesion</button>
        </nav>
    </header>

    <main>

        <h1>Contacta con nosotros!</h1>
        <p>Tienes alguna duda sobre un evento o te gustaría agendar tu propio evento.</p>
        <p>No dudes en <strong>Contactanos</strong></p>
        <section>
            <form action="">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required />

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required />

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

                <p id="error" style="color: red;"></p>

                <button type="button" onclick="mandarMensaje()">Enviar</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Voyager Group. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/contacto.js"></script>
    <script src="../js/index.js"></script>
</body>

</html>
